# Builds and publishes the Tripwire Android release.
#
# Runs on:
#   * a push of a tag matching `tripwire-*` (e.g. tripwire-1.2.3)
#   * manual `workflow_dispatch` (with an explicit tag, e.g. tripwire-1.2.3)
#
# V1 is mobile-only: there are no desktop jobs in this workflow. Validation
# (go vet/test, frontend type-check/lint/test) lives in ci.yml.
#
# Artifacts produced (attached to a single GitHub Release):
#   * `Tripwire-<version>.apk` — the sideload APK users install. Signed with
#     your upload key when the ANDROID_* secrets are configured, otherwise
#     debug-signed (installable for testing, not for Play Store) and named
#     `Tripwire-<version>-debug.apk` so it is never mistaken for a release.
#   * `Tripwire-<version>.aab` — the Play Store bundle (same signing rule).
#
# The release notes generated for the GitHub Release double as the in-app
# "What's new" text: the Android updater shows the body of the latest
# release in the update dialog.

name: Release

on:
  push:
    tags:
      - 'tripwire-*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create/update the release for (e.g. tripwire-1.2.3). Leave blank to build without publishing.'
        required: false
        default: ''

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  WAILS3_VERSION: latest

jobs:
  build-android:
    name: Package (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Signing uses the upload key when the ANDROID_* secrets are configured,
    # otherwise the debug keystore (installable for testing, not for
    # Play Store).
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `go install` compiles the wails3 CLI for the host, and on Linux that
      # links GTK/WebKit (internal/operatingsystem uses CGO) — the app
      # itself cross-compiles to Android via the NDK.
      - name: Install Linux build dependencies (GTK4 + WebKitGTK 6.0)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libwayland-dev

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform, build tools and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # versionName follows the release tag (tripwire-1.2.3 -> 1.2.3);
      # versionCode is the monotonic run number. Manual builds without a
      # tripwire-* tag keep the defaults in build/android/app/build.gradle.
      # The bare version is also exported as APP_VERSION for asset naming.
      - name: Derive Android version from tag
        run: |
          TAG="${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ ^tripwire-([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "ANDROID_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
            echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "Building Tripwire ${VERSION}"
          else
            echo "No tripwire-* version tag ($TAG); keeping build.gradle defaults."
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Only runs when the keystore secret exists; otherwise Gradle falls back
      # to the debug keystore (installable for testing, not for Play Store).
      - name: Configure release signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/android/keystore.jks
          {
            echo "ANDROID_KEYSTORE_FILE=$PWD/build/android/keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: wails3 task android:package

      - name: Build release AAB
        run: wails3 task android:bundle

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          # The in-app updater looks for an asset named Tripwire-<version>.apk,
          # so the APK name is part of the update contract — keep it stable.
          VERSION="${APP_VERSION:-untagged}"
          SUFFIX=""
          if [ "${HAS_KEYSTORE}" != "true" ]; then
            SUFFIX="-debug"
          fi
          if [ -f bin/tripwire.apk ]; then cp bin/tripwire.apk "release-assets/Tripwire-${VERSION}${SUFFIX}.apk"; fi
          if [ -f bin/tripwire.aab ]; then cp bin/tripwire.aab "release-assets/Tripwire-${VERSION}${SUFFIX}.aab"; fi
          ls -la release-assets

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tripwire-android
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android]
    # Requires a tripwire-* tag (from the push event or the manual
    # `tag_name` input). Untagged manual runs stop after building.
    if: ${{ needs.build-android.result == 'success' && (startsWith(github.ref, 'refs/tags/tripwire-') || startsWith(inputs.tag_name, 'tripwire-')) }}
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List release assets
        run: find dist -type f -print

      - name: Resolve tag and title
        id: meta
        run: |
          TAG="${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=Tripwire ${TAG#tripwire-}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
